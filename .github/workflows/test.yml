name: Tests and distributions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install '${{ matrix.python-version }}'
      - name: Install development dependencies
        run: uv sync --extra dev --locked --python '${{ matrix.python-version }}'
      - name: Run Ruff
        run: uv run --no-sync ruff check .
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Check event performance workloads at a small scale
        run: >-
          uv run --no-sync pytest tests/performance/test_thread_events.py
          --run-performance --thread-workers 8 --thread-iterations 8
      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build
      - name: Check distribution metadata
        run: uv run --no-sync python -m twine check --strict dist/*
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          uv venv --python '${{ matrix.python-version }}' .package-venv
          wheels=(dist/*.whl)
          uv pip install --python .package-venv/bin/python "${wheels[0]}[dev]"
          .package-venv/bin/python -I scripts/smoke_test.py
          .package-venv/bin/python -I -m pytest
      - name: Test installation from the source distribution
        shell: bash
        run: |
          uv pip install --python .package-venv/bin/python --reinstall-package apixis dist/*.tar.gz
          .package-venv/bin/python -I scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: dist/*

  free-threading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONASYNCIODEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up free-threaded Python
        run: uv python install 3.14t
      - name: Install development dependencies
        run: uv sync --extra dev --locked --python 3.14t
      - name: Run all tests with the GIL disabled
        run: >-
          timeout 300s uv run --no-sync pytest --require-free-threading
          -o faulthandler_timeout=60 -o junit_family=xunit1
          --junitxml=test-results/free-threading-suite.xml
      - name: Stress bounded event queues
        run: >-
          timeout 600s uv run --no-sync pytest --require-free-threading
          tests/integration/event/test_backpressure_boundaries.py
          tests/integration/event/test_thread_event_routing.py
          -o faulthandler_timeout=60 -o junit_family=xunit1
          --junitxml=test-results/free-threading-stress.xml
      - name: Saturate thread bridge admission and cancellation
        run: >-
          timeout 300s uv run --no-sync pytest --require-free-threading
          tests/performance/test_thread_events.py --run-performance -k '[1]'
          --thread-workers 128 --thread-iterations 128 --thread-queue-size 1
          -o faulthandler_timeout=60 -o junit_family=xunit1
          --thread-report test-results/free-threading-threads.json
          --junitxml=test-results/free-threading-threads.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-threading-results
          path: |
            test-results/free-threading-*.xml
            test-results/free-threading-*.json
